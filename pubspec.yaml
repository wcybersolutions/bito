name: bito
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^17.4.0

  # Utils
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  phosphor_flutter: ^2.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  syncfusion_flutter_charts: 34.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  analyzer: 6.4.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_logo.png
